name: Release
# Push a tag like v0.2.0 to build Windows + Mac apps and publish them as a GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: { contents: read }

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, script: 'package:win', artifact: windows-x64 }
          - { os: macos-latest, script: 'package:mac', artifact: mac-arm64, arch: arm64 }
          - { os: macos-latest, script: 'package:mac', artifact: mac-x64, arch: x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Import the Developer ID certificate (Mac, only when the Apple secrets are set)
        if: runner.os == 'macOS' && env.MAC_CERT_P12 != ''
        env:
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          echo "$MAC_CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          security list-keychains -d user -s build.keychain login.keychain
          rm cert.p12
      - run: npm run ${{ matrix.script }}
        env:
          ARCH: ${{ matrix.arch }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Smoke test the packaged app (launches it and runs the offline self test)
        if: matrix.artifact != 'mac-x64'
        continue-on-error: true
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then APP="dist/Heliarc-darwin-arm64/Heliarc.app/Contents/MacOS/Heliarc"; else APP="dist/Heliarc-win32-x64/Heliarc.exe"; fi
          "$APP" --selftest-local > smoke.txt 2> smoke-err.txt || true
          echo "--- results"; grep -c '^PASS' smoke.txt || true; grep '^FAIL' smoke.txt || echo "no failures"
          echo "--- stderr"; head -40 smoke-err.txt
          grep -q '^PASS' smoke.txt && ! grep -q '^FAIL' smoke.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    permissions: { contents: write } # only this job publishes; the build jobs run npm install scripts and get a read-only token
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with: { path: dist, merge-multiple: true }
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          ## Install
          - **Windows**: unzip `Heliarc-windows-x64.zip`, run `Heliarc.exe`. Windows may show "Windows protected your PC" (the app isn't code-signed yet): click *More info* → *Run anyway*.
          - **Mac** (easiest): paste this in Terminal, it installs the right version and opens it:

            `curl -fsSL https://raw.githubusercontent.com/mikedotJS/heliarc/main/scripts/install-mac.sh | zsh`

            Or unzip `Heliarc-mac-arm64.zip` (Apple Silicon) / `Heliarc-mac-x64.zip` (Intel) and drag `Heliarc.app` to Applications. The Mac app is signed and notarized by Apple: it opens like any other app.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/*.zip --repo "$GITHUB_REPOSITORY" --title "Heliarc ${GITHUB_REF_NAME#v}" --generate-notes --notes-file notes.md
