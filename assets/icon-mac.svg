<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f5ff"></stop><stop offset=".45" stop-color="#ebe8ff"></stop><stop offset="1" stop-color="#f6e9ff"></stop></linearGradient>
    <radialGradient id="hl" cx=".3" cy=".2" r=".6"><stop offset="0" stop-color="#fff" stop-opacity=".9"></stop><stop offset="1" stop-color="#fff" stop-opacity="0"></stop></radialGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c8cff"></stop><stop offset=".45" stop-color="#5b4bff"></stop><stop offset="1" stop-color="#c04bff"></stop></linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfbff"></stop><stop offset=".5" stop-color="#f1eeff"></stop><stop offset="1" stop-color="#f5ecff"></stop></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="46"></feGaussianBlur></filter>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".22"></feDropShadow></filter>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="190"></rect></clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="190" fill="url(#bg)" filter="url(#sh)"></rect>
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#hl)"></rect>
    <circle cx="512" cy="512" r="274" fill="#7c64ff" opacity=".35" filter="url(#glow)"></circle>
    <circle cx="512" cy="512" r="274" fill="url(#sun)"></circle>
    <circle cx="481.9" cy="472.7" r="266.2" fill="url(#moon)"></circle>
    <rect x="100" y="100" width="824" height="824" rx="190" fill="none" stroke="#000" stroke-opacity=".05" stroke-width="10" transform="translate(0,-5)"></rect>
  </g>
</svg>