<!doctype html><html data-theme="light"><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="script-src file: 'unsafe-inline'; object-src 'none'; base-uri 'none'; frame-src 'none'; form-action 'none'"><link rel="stylesheet" href="common.css"><script src="icons.js"></script>
<style>
  body { background: var(--scrim); height: 100vh; display: flex; justify-content: center; padding-top: 14vh; color: var(--fg); }
  @keyframes fade { from { opacity: 0 } } @keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.975) } } @keyframes row { from { opacity: 0; transform: translateY(6px) } }
  body.in { animation: fade var(--dur-ui) var(--ease-out) } body.in #box { animation: rise var(--dur-ui) var(--ease-out) }
  body.in .row { animation: row var(--dur-ui) var(--ease-out) both; animation-delay: calc(60ms + var(--i, 0) * var(--stagger)) }
  body.out { opacity: 0; transition: opacity var(--dur-exit) var(--ease-in) } body.out #box { transform: translateY(8px) scale(.985); transition: transform var(--dur-exit) var(--ease-in) }
  .row { transition: background var(--dur-micro) var(--ease-out) }
  #box { width: min(640px, 100%); height: fit-content; background: var(--panel); border-radius: var(--r-lg); box-shadow: 0 24px 60px var(--scrim); overflow: hidden }
  #bar { display: flex; align-items: center; gap: 10px; padding: 0 20px }
  #in { flex: 1; min-width: 0; border: 0; outline: 0; padding: 18px 0; font-family: system-ui, sans-serif; font-size: var(--fs-xl); user-select: text }
  #tag { flex: none; border-radius: var(--r-md); padding: 4px 10px; font: 600 14px system-ui, sans-serif; white-space: nowrap; animation: pop var(--dur-micro) var(--ease-out) } #tag[hidden] { display: none }
  @keyframes pop { from { opacity: 0; transform: scale(.85) } }
  .row .chip { border-radius: var(--r-sm); padding: 1px 7px; font-size: var(--fs-md); font-weight: 600 }
  #res { border-top: 1px solid var(--line); padding: 6px; max-height: 50vh; overflow-y: auto }
  .row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--r-md); cursor: pointer; overflow: hidden; white-space: nowrap }
  .row.sel { background: var(--sel) } .row .ic { color: var(--acc); flex: none } .row small { color: var(--dim); overflow: hidden; text-overflow: ellipsis } .row b { font-weight: 500 }
  .row .k { margin-left: auto; font-size: var(--fs-xs); color: var(--dim); flex: none }
  #hint { padding: 8px 18px; font-size: var(--fs-xs); color: var(--dim); border-top: 1px solid var(--line) }
</style>
<div id="box"><div id="bar"><span id="tag" hidden></span><input id="in" placeholder="Search or enter address…" spellcheck="false" autocomplete="off"></div><div id="res"></div>
<div id="hint">Enter to go · ↑↓ to pick · Esc to close · Bangs: type ! to see them</div></div>
<script>
const $ = s => document.querySelector(s), esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))
let state = { tabs: [] }, mode = 'new', sel = 0, rows = [], hist = [], bangs = [], tag = null, completion = null // completion: the visited site the bar is offering to finish the typed text with
api.onState(s => { state = s })
// the visited site whose address starts with what is typed (www. ignored), the one with the most pages in the history first, then the latest
function complete(q) {
  if (!q || tag || /[\s/:!?#]/.test(q)) return null
  const found = new Map(), ql = q.toLowerCase()
  for (const h of hist) { try { const u = new URL(h.url), host = u.hostname.replace(/^www\./, ''); if (/^https?:$/.test(u.protocol) && host.startsWith(ql) && host.length > ql.length) { const f = found.get(host) || { n: 0, at: 0 }; found.set(host, { n: f.n + 1, at: Math.max(f.at, h.at || 0) }) } } catch {} }
  return [...found].sort((a, b) => b[1].n - a[1].n || b[1].at - a[1].at)[0]?.[0] ?? null
}
// a bang typed in full ("!yt ") becomes a tag in the bar, in the site's colour; what is typed after it is the search
const ink = c => { const n = /^#[0-9a-f]{6}$/i.test(c) && parseInt(c.slice(1), 16); return n !== false && (.299 * (n >> 16) + .587 * (n >> 8 & 255) + .114 * (n & 255)) > 170 ? 'var(--on-light)' : 'var(--on-color)' }
function setTag(b) {
  tag = b; const t = $('#tag'); t.hidden = !b; $('#in').placeholder = b ? `Search ${b.name}…` : 'Search or enter address…'
  if (b) { t.textContent = b.name; t.style.background = b.color; t.style.color = ink(b.color) }
}
const chip = b => `<span class="chip" style="background:${b.color};color:${ink(b.color)}">!${esc(b.trigger)}</span>`
const typed = () => { const i = $('#in'), v = (completion && i.selectionStart < i.selectionEnd ? i.value.slice(0, i.selectionStart) : i.value).trim(); return tag ? (v ? `!${tag.trigger} ${v}` : '') : v }
function render() {
  const q = typed(), ql = q.toLowerCase()
  rows = []
  const bm = q.match(/^!(\w*)$/), bs = q.match(/^!(\w+)\s+(.+)$/), bang = bs && bangs.find(x => x.trigger === bs[1].toLowerCase()) // "!y" lists matching bangs, "!yt lofi" says where it goes
  if (bm) bangs.filter(x => x.trigger.startsWith(bm[1].toLowerCase())).slice(0, 8).forEach(x => rows.push({ kind: 'bang', chip: chip(x), label: '', sub: x.name, run: () => { setTag(x); $('#in').value = ''; sel = 0; render(); $('#in').focus() }, key: 'Tab' }))
  if (completion) rows.push({ kind: 'go', label: mode === 'edit' ? `Go to “${completion}”` : `Open “${completion}” in a new tab`, run: () => api.call(mode === 'edit' ? 'go' : 'open', completion), key: '↵' })
  if (tag && !q) rows.push({ kind: 'none', label: `Type what to search on ${tag.name}`, run: () => {} })
  else if (bang) rows.push({ kind: 'bang', label: `Search ${bang.name} for “${bs[2]}”`, run: () => api.call(mode === 'edit' ? 'go' : 'open', q), key: '↵' })
  else if (q && !bm) rows.push({ kind: 'go', label: mode === 'edit' ? `Go to “${q}”` : `Open “${q}” in a new tab`, run: () => api.call(mode === 'edit' ? 'go' : 'open', q), key: '↵' })
  if (!tag) state.tabs.filter(t => !q || (t.title + ' ' + t.url).toLowerCase().includes(ql)).slice(0, 8)
    .forEach(t => rows.push({ kind: 'tab', label: t.title || t.url, sub: t.url, run: () => api.call('activate', t.id).then(() => api.call('closeCmd')), key: 'Switch to tab' }))
  const open = new Set(state.tabs.map(t => t.url))
  if (!tag) hist.filter(h => !open.has(h.url)).slice(0, 5).forEach(h => rows.push({ kind: 'hist', label: h.title || h.url, sub: h.url, run: () => api.call(mode === 'edit' ? 'go' : 'open', h.url), key: 'History' }))
  if (!rows.length) rows.push({ kind: 'none', label: 'Type to search the web or open a site', run: () => {} })
  sel = Math.min(sel, rows.length - 1)
  $('#res').innerHTML = rows.map((r, i) => `<div class="row ${i === sel ? 'sel' : ''}" data-i="${i}" style="--i:${i}">${icon(r.kind === 'tab' ? 'layers' : r.kind === 'go' || r.kind === 'bang' ? 'search' : r.kind === 'hist' ? 'history' : 'globe', 16)} ${r.chip || ''}<b>${esc(r.label)}</b> <small>${esc(r.sub || '')}</small><span class="k">${r.key || ''}</span></div>`).join('')
}
$('#in').oninput = async e => {
  const el = $('#in'), m = !tag && $('#in').value.match(/^!(\w+)\s+/), b = m && bangs.find(x => x.trigger === m[1].toLowerCase())
  if (b) { setTag(b); $('#in').value = $('#in').value.slice(m[0].length) }
  const adding = !e?.inputType?.startsWith('delete') && el.selectionStart === el.value.length // typing at the end of the bar, not deleting
  completion = null; sel = 0; render(); const q = typed(); hist = q && !tag ? await api.call('history', q) : []
  if (q === typed()) { completion = adding && el.value === q ? complete(q) : null; render(); if (completion) { el.value = q + completion.slice(q.length); el.setSelectionRange(q.length, el.value.length) } } // the offered rest of the address is selected: typing goes on over it, Backspace drops it
}
$('#in').onkeydown = e => {
  if (e.key === 'Escape') close()
  else if (e.key === 'Backspace' && tag && !$('#in').selectionStart && !$('#in').selectionEnd) { const t = tag; setTag(null); $('#in').value = '!' + t.trigger + ($('#in').value ? ' ' : '') + $('#in').value; $('#in').setSelectionRange(t.trigger.length + 1, t.trigger.length + 1); sel = 0; render(); e.preventDefault() } // Backspace at the start turns the tag back into text
  else if (e.key === 'ArrowDown') { sel = (sel + 1) % rows.length; render(); e.preventDefault() }
  else if (e.key === 'ArrowUp') { sel = (sel - 1 + rows.length) % rows.length; render(); e.preventDefault() }
  else if ((e.key === 'Tab' || e.key === 'ArrowRight') && completion && $('#in').selectionStart < $('#in').selectionEnd) { const i = $('#in'); completion = null; i.setSelectionRange(i.value.length, i.value.length); render(); e.preventDefault() } // accept the offered address
  else if (e.key === 'Tab' && rows[sel]?.kind === 'bang' && rows[sel].key === 'Tab') { rows[sel].run(); e.preventDefault() }
  else if (e.key === 'Enter') rows[sel]?.run()
}
$('#res').onclick = e => { const r = e.target.closest('.row'); r && rows[+r.dataset.i]?.run() }
document.body.onmousedown = e => { if (!e.target.closest('#box')) close() }
let closing
const close = () => { document.body.classList.add('out'); clearTimeout(closing); closing = setTimeout(() => api.call('closeCmd'), 200) }
api.onOpen(o => {
  clearTimeout(closing); api.call('bangList').then(l => { bangs = l; render() }) // reloaded at each opening: a bang added or removed in Settings counts right away
  document.body.classList.remove('out', 'in'); void document.body.offsetWidth; document.body.classList.add('in'); setTimeout(() => document.body.classList.remove('in'), 700); mode = o.mode; sel = 0; hist = []; completion = null; setTag(null);document.body.style.paddingLeft = o.left + 'px'; document.body.style.paddingRight = o.right + 'px'; $('#in').value = o.value; render(); $('#in').focus(); $('#in').select() })
</script>
