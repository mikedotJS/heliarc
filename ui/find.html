<!doctype html><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="script-src file: 'unsafe-inline'; object-src 'none'; base-uri 'none'; frame-src 'none'; form-action 'none'"><link rel="stylesheet" href="common.css"><script src="icons.js"></script>
<style>
  body { background: transparent; padding: 4px 6px 12px 6px }
  @keyframes drop { from { opacity: 0; transform: translateY(-8px) } } body.in #bar { animation: drop var(--dur-ui) var(--ease-out) }
  #bar { display: flex; align-items: center; gap: 4px; background: var(--panel); border-radius: var(--r-view); padding: 6px 8px; box-shadow: 0 8px 28px var(--scrim); border: 1px solid var(--hover) }
  #q { flex: 1; min-width: 0; background: var(--bg); color: var(--fg); border: 1px solid transparent; border-radius: var(--r-md); padding: 7px 10px; font: inherit; outline: 0; user-select: text } #q:focus { border-color: var(--acc) }
  #bar.none #q { border-color: var(--err) } #n { color: var(--dim); font-size: var(--fs-sm); min-width: 52px; text-align: center } #bar.none #n { color: var(--err) }
  button { padding: 5px 7px }
</style>
<div id="bar"><input id="q" placeholder="Find in page" spellcheck="false" autocomplete="off"><span id="n"></span><button id="p" title="Previous (Shift+Enter)"></button><button id="nx" title="Next (Enter)"></button><button id="x" title="Close (Esc)"></button></div>
<script>
const $ = s => document.querySelector(s); let last = ''
$('#p').innerHTML = icon('chevron-down', 16).replace('<svg', '<svg style="transform:rotate(180deg)"'); $('#nx').innerHTML = icon('chevron-down', 16); $('#x').innerHTML = icon('x', 16)
const search = (fwd = true, next = false) => { last = $('#q').value; api.call('findText', last, fwd, next) }
$('#q').oninput = () => { $('#n').textContent = ''; $('#bar').classList.remove('none'); search() }
$('#q').onkeydown = e => { if (e.key === 'Escape') api.call('findClose'); else if (e.key === 'Enter') { e.preventDefault(); $('#q').value && search(!e.shiftKey, true) } }
$('#nx').onclick = () => $('#q').value && search(true, true); $('#p').onclick = () => $('#q').value && search(false, true); $('#x').onclick = () => api.call('findClose')
api.on('found', r => { const none = $('#q').value && !r.total; $('#bar').classList.toggle('none', !!none); $('#n').textContent = !$('#q').value ? '' : none ? 'No match' : `${r.active} / ${r.total}` })
api.on('find:open', t => { document.body.classList.remove('in'); void document.body.offsetWidth; document.body.classList.add('in'); $('#q').value = t || ''; $('#q').focus(); $('#q').select(); $('#q').value && search() })
</script>
