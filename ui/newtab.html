<!doctype html><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="script-src file: 'unsafe-inline'; object-src 'none'; base-uri 'none'; frame-src 'none'; form-action 'none'"><title>New tab</title><link rel="stylesheet" href="common.css">
<style>
  body { margin: 0; height: 100vh; display: grid; place-content: center; text-align: center; background: var(--bg); color: var(--fg); font: var(--fs-lg) system-ui, sans-serif }
  h1 { font-size: var(--fs-display); font-weight: 300; letter-spacing: .1em } p { color: var(--dim); margin-top: 14px; line-height: 1.8 }
  code { background: var(--hover); padding: 2px 6px; border-radius: var(--r-sm) }
</style>
<img src="../assets/icon.png" width="96" style="margin:0 auto 10px"><h1>Heliarc</h1>
<p>Private, quiet, fast.<br>Type in the address bar (<code id="k">Ctrl+L</code>) — or use a bang:<br>
<code>!w cats</code> <code>!yt lofi</code> <code>!gh electron</code> <code>!g weather</code></p>
<script>
// the address-bar shortcut comes from main (user-customizable) in the URL hash, e.g. #Mod+L
const MAC = navigator.platform.startsWith('Mac'), k = decodeURIComponent(location.hash.slice(1)) || 'Mod+L'
document.getElementById('k').textContent = k.split('+').map(p => ({ Mod: MAC ? '⌘' : 'Ctrl', Shift: MAC ? '⇧' : 'Shift', Alt: MAC ? '⌥' : 'Alt', Ctrl: MAC ? '⌃' : 'Ctrl' }[p] || p)).join(MAC ? '' : '+')
</script>
