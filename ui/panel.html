    <div class="msg">The Private space (${esc(fmt(S.keys.newPrivateTab))}) keeps nothing: no history, no saved tabs, no extensions, and it is wiped when its last tab closes. Pages are never preloaded in the background.</div></section>

  <section><h3>Import from another browser</h3>

    <div class="line"><label>From a file<small>Bookmarks exported as HTML, or Safari’s History.db. For passwords from Firefox or Safari, export them as a CSV from that browser first</small></label><button class="ds-btn sm" data-a="importFile" data-what="bookmarks">Bookmarks…</button><button class="ds-btn sm" data-a="importFile" data-what="passwords">Passwords…</button><button class="ds-btn sm" data-a="importFile" data-what="safari">Safari history…</button></div>
    <div class="msg ${note?.import?.error ? 'bad' : note?.import ? 'ok' : ''}">${esc(note?.import?.error || note?.import?.text || '')}</div></section>
  <section><h3>Spaces: name, icon and colours</h3>
    ${S.spaces.map((s, i) => s.private ? '' : `<div class="spedit"><div class="line"><span class="spprev" style="background:linear-gradient(145deg,${esc(s.c1)},${esc(s.c2)})">${icon(s.icon, 16)}</span><input class="ds-field" data-sp="${i}" data-f="name" value="${esc(s.name)}" maxlength="20" spellcheck="false" style="flex:1"><input type="color" data-sp="${i}" data-f="c1" value="${esc(s.c1)}" title="First colour"><input type="color" data-sp="${i}" data-f="c2" value="${esc(s.c2)}" title="Second colour"></div>
      <div class="icons">${SPACE_ICONS.map(n => `<button class="ibtn ${n === s.icon ? 'on' : ''}" data-a="spaceIcon" data-sp="${i}" data-icon="${n}" title="${n}">${icon(n, 16)}</button>`).join('')}</div></div>`).join('')}</section>
  <section><h3>Spaces: open sites in the right space</h3>
    ${st.routes.map(r => `<div class="line"><label>${esc(r.host)}<small>always opens in ${esc(S.spaces[r.space]?.name)}</small></label><button class="ds-btn sm" data-a="delRoute" data-host="${esc(r.host)}">${icon('trash-2', 14)}</button></div>`).join('') || '<div class="msg">No rules yet. You can also right-click a tab → “Always open … in”.</div>'}
    <div class="line"><input class="ds-field" id="rhost" placeholder="example.com" value="${esc(draft.rhost)}" style="flex:1" spellcheck="false"><select class="ds-select" id="rspace">${S.spaces.map((s, i) => s.private ? '' : `<option value="${i}" ${String(i) === draft.rspace ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select><button class="ds-btn sm" data-a="addRoute">Add</button></div>
    <div class="msg ${note?.route ? 'bad' : ''}">${esc(note?.route || '')}</div></section>
  <section><h3>Keyboard shortcuts</h3>
    ${Object.entries(S.keys).map(([a, k]) => `<div class="line"><label>${esc(S.labels[a])}</label><kbd class="${recordingFor === a ? 'rec' : ''}">${recordingFor === a ? 'Press keys…' : esc(fmt(k))}</kbd><button class="ds-btn sm" data-a="record" data-action="${a}">${recordingFor === a ? 'Cancel' : 'Change'}</button>${st.shortcuts[a] ? `<button class="ds-btn sm" data-a="resetKey" data-action="${a}" title="Back to default">${icon('undo-2', 14)}</button>` : ''}</div>`).join('')}
    <div class="msg ${note?.key ? 'bad' : ''}">${note?.key ? esc(note.key) : 'Click Change, then press the new combination (Esc to cancel).'}</div></section>
  <section><h3>Autofill</h3><div class="msg">Used to fill address forms when you click a field. Stored on this device only.</div>
    ${stateMsg() ?? `<div class="form">${[['first', 'First name'], ['last', 'Last name'], ['email', 'Email'], ['phone', 'Phone'], ['org', 'Organization'], ['street', 'Street address'], ['zip', 'Postal code'], ['city', 'City'], ['country', 'Country']].map(([k, l]) => `<input class="ds-field" data-pf="${k}" placeholder="${l}" value="${esc(p[k] || '')}">`).join('')}
    <button class="ds-btn sm wide" data-a="saveProfile">Save autofill</button><div class="msg wide ${note?.profile ? 'ok' : ''}">${note?.profile || ''}</div></div>`}</section>`
}
const did = el => +el.closest('[data-id]').dataset.id
async function work(key, field, text, call, failed) { // one at a time: the buttons are disabled until the answer, which is a result or an error message
  if (working) return
  working = key; note = { [field]: { text } }; render()
  try { note = { [field]: await call() } } catch { note = { [field]: { error: failed } } }
  working = null; paint()
}
const ACT = {
  retry: load, clearDownloads: () => api.call('clearDownloads'), clearArchive: () => api.call('clearArchive'), clearHistory: async () => { await api.call('clearHistory'); load() },
  openFile: async el => { const r = await api.call('openFile', did(el)); if (r || note?.dl) { note = r ? { dl: `Couldn’t open this file: ${r}` } : null; render() } }, showFile: el => api.call('showFile', did(el)), cancelDownload: el => api.call('cancelDownload', did(el)), retryDownload: async el => { const r = await api.call('retryDownload', did(el)); if (r?.error) { note = { dl: r.error }; render() } }, // the main process answers with the system's error text, or nothing when it worked
  retryExt: async el => { note = { text: 'Trying again…' }; render(); const r = await api.call('retryExtension', el.dataset.eid); note = r.ok ? { text: 'Started.', cls: 'ok' } : { text: 'Still can’t start. You can remove it and install it again.', cls: 'bad' }; load() }, delDownload: el => api.call('delDownload', did(el)),
  restoreArchive: async el => { await api.call('restoreArchive', +el.dataset.i); close() },
  openUrl: async el => { await api.call('open', el.dataset.url); close() },
  delHistory: async el => { await api.call('delHistory', +el.dataset.at); load() }, delPassword: async el => { await api.call('delPassword', did(el)); load() },
  importRun: el => work(el.dataset.id + el.dataset.what, 'import', 'Importing…', () => api.call('importRun', el.dataset.id, el.dataset.what), 'Import failed. Try again.'),
  importFile: async el => { const r = await api.call('importFile', el.dataset.what); note = r.canceled ? null : { import: r }; render() },
  prot: el => api.call('toggleSite', el.dataset.kind, el.dataset.host), protReset: el => api.call('resetSite', el.dataset.host),
  allowPw: async el => { await api.call('allowPw', el.dataset.o) },
  checkUpdate: () => work('update', 'update', 'Checking…', () => api.call('checkUpdate'), 'Could not check for updates. Try again.'),
  spaceIcon: el => api.call('editSpace', +el.dataset.sp, { icon: el.dataset.icon }),
  delRoute: el => api.call('delRoute', el.dataset.host), delBang: el => api.call('delBang', el.dataset.trigger),
  addBang: async () => { const r = await api.call('addBang', $('#btrig').value, $('#burl').value); note = r.error ? { bang: r.error } : null; if (!r.error) draft.btrig = draft.burl = ''; render() },
  installExt: async () => {
    const v = $('#extin').value.trim(); if (!v) { note = { text: 'Paste a Chrome Web Store link or an extension ID.', cls: 'bad' }; return render() }
    installing = true; note = null; render()
    const r = await api.call('installExtension', v); installing = false
    note = r.error ? { text: r.error, cls: 'bad' } : { text: `Installed “${r.name}”.`, cls: 'ok' }; if (!r.error) draft.extin = ''; load()
  },
  removeExt: async el => { await api.call('removeExtension', el.dataset.eid); note = null; load() },
  addRoute: async () => {
    const h = $('#rhost').value, ok = (() => { try { return /^[\w.-]+$/.test(new URL('https://' + h.trim().replace(/^https?:\/\//i, '')).hostname) } catch {} })() // a plain host name, as the main process reads it
    if (!ok) { note = { route: 'Enter a site address, like example.com.' }; return render() }
    const r = await api.call('addRoute', h, +$('#rspace').value); note = r?.error ? { route: r.error } : null; if (!r?.error) draft.rhost = ''; render()
  },
  defaultBrowser: async () => { const ok = await api.call('defaultBrowser'); note = { text: ok ? 'Heliarc is now the default browser.' : 'Choose Heliarc in the system settings window that just opened.', cls: ok ? 'ok' : '' }; render() },
  saveProfile: async () => { const p = {}; document.querySelectorAll('[data-pf]').forEach(i => p[i.dataset.pf] = i.value.trim()); await api.call('setProfile', p); data = p; const mine = note = { profile: 'Saved ✓' }; render(); setTimeout(() => { if (note === mine) { note = null; section === 'settings' && paint() } }, 2500) },
  record: el => recordingFor === el.dataset.action ? stopRec() : startRec(el.dataset.action),
  resetKey: async el => { await api.call('setShortcut', el.dataset.action, null); note = null },
}
$('#body').onclick = $('#head').onclick = e => {
  const el = e.target.closest('[data-a]'); if (!el) return
  e.stopPropagation(); ACT[el.dataset.a]?.(el)
}
$('#body').onkeydown = e => { if ((e.key === 'Enter' || e.key === ' ' && e.target.matches('[role=button]')) && e.target.matches('.row[data-a], .thumb[data-a]')) { e.preventDefault(); e.target.click() } } // Enter opens a row or a thumbnail, Space too when it is a button (not a link)
$('#body').oninput = e => { if (e.target.dataset.pf) (data ??= {})[e.target.dataset.pf] = e.target.value; else if (Object.hasOwn(draft, e.target.id)) draft[e.target.id] = e.target.value } // keep unsaved autofill edits across re-renders
$('#body').onchange = async e => {
  const t = e.target
  try { if (t.dataset.perm) { const [h, k] = t.dataset.perm.split('|'); await api.call('setSitePerm', h, k, t.value === 'x' ? null : t.value === '1') }
  else if (t.matches('[data-list]')) await api.call('setSetting', 'adblockList', t.value)
  else if (t.matches('[data-engine]')) await api.call('setSetting', 'searchEngine', t.value)
  else if (t.matches('[data-side]')) await api.call('setSetting', 'sidebarSide', t.value)
  else if (t.matches('[data-hours]')) await api.call('setSetting', 'archiveHours', +t.value)
  else if (t.dataset.f) await api.call('editSpace', +t.dataset.sp, { [t.dataset.f]: t.value })
  else if (t.dataset.set) await api.call('setSetting', t.dataset.set, t.checked) }

}
function startRec(a) { recordingFor = a; note = null; api.call('recording', true); render() }
function stopRec() { recordingFor = null; api.call('recording', false); render() }
addEventListener('keydown', async e => {
  idle = false; if (e.key === ' ' && !e.repeat && e.target.matches('button, input[type=checkbox]')) pressed = true // a button or a switch acts when Space is let go
  if (recordingFor) {
    if (['Control', 'Shift', 'Alt', 'Meta'].includes(e.key)) return
    e.preventDefault(); e.stopPropagation()
    if (e.key === 'Escape') return stopRec()
    const c = await api.call('comboOf', { key: e.key, code: e.code, control: e.ctrlKey, meta: e.metaKey, alt: e.altKey, shift: e.shiftKey })
    const r = await api.call('setShortcut', recordingFor, c)
    note = r.error ? { key: r.error } : null; if (!r.error) stopRec(); else render()
  } else if (e.key === 'Escape') close()
}, true)
document.body.onmousedown = e => { if (!e.target.closest('#card')) close() }
let closing
const close = () => { recordingFor = null; api.call('recording', false); document.body.classList.add('out'); clearTimeout(closing); closing = setTimeout(() => api.call('closePanel'), 200) }
// when to redraw: at once, except while a mouse button is down (the click would be lost) or a text field, a select or a colour picker has the focus (the history search field is the exception: render() gives it back its caret).
// What cannot be drawn now is kept (stale) and drawn when the button is let go or the focus leaves; `idle`: the select or picker has just made its choice, it holds nothing any more.
let pressed = false, stale = false, idle = false, want = null
const typing = () => section !== 'history' && !idle && document.activeElement?.matches('input:not([type=checkbox]), select')
const paint = () => pressed || typing() ? stale = true : render()
const settle = () => stale && setTimeout(() => stale && !pressed && paint(), 60)
addEventListener('pointerdown', e => { idle = false; want = null; if (e.button === 0 && !e.target.closest('select, input:not([type=checkbox]):not([type=color])')) pressed = true }, true)
const release = () => { pressed = false; settle() }
for (const ev of ['pointerup', 'pointercancel']) addEventListener(ev, release, true)
addEventListener('keyup', e => e.key === ' ' && release(), true)
addEventListener('blur', release) // not in capture: it would hear every field losing focus, and let go of a button that is still down
addEventListener('focusout', settle) // a field was left (by the keyboard too)
api.onState(s => { state = s; section !== 'history' && paint() })
api.on('panel', o => { pressed = false; clearTimeout(closing); document.body.classList.remove('out', 'in'); void document.body.offsetWidth; document.body.classList.add('in'); setTimeout(() => document.body.classList.remove('in'), 700); open(o.section) })
</script>
